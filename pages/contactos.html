<body>
    <header>
        <nav class="navbar" role="navigation" aria-label="Menú principal">
            <img src="../assets/images/logo.png" alt="Logo Panadería Los 5 Hermanos" class="navbar-logo">
            <div class="nav-links">
                <a href="../index.html">Historia</a>
                <a href="./elaboracion.html">Elaboración</a>
                <a href="./productos.html">Productos</a>
                <a href="./nos-encontraras.html">Nos encontrarás...</a>
                <a href="./contactos.html" aria-current="page">Contactos</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="contacto">
            <div class="contacto-container">
                <h2>Contacto</h2>
                <p>Comunicate con Panadería Los 5 Hermanos para realizar pedidos o consultas.</p>

                <form class="formulario-contacto" action="mailto:Panaderia5Hermanos@gmail.com" method="post" enctype="text/plain" aria-label="Formulario de contacto">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Nombre completo" required autocomplete="name" aria-required="true">

                    <label for="email">Correo electrónico</label>
                    <input id="email" name="email" type="email" placeholder="Correo electrónico" required autocomplete="email" aria-required="true">

                    <label for="telefono">Número de teléfono</label>
                    <input id="telefono" name="telefono" type="tel" placeholder="Número de teléfono" autocomplete="tel">

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribí tu mensaje..." rows="5" required aria-required="true"></textarea>

                    <button type="submit">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer id="footer">
        <div class="footer-items">
            <h3>Contactos</h3>
            <div>
                <p>E-mail: Panaderia5Hermanos@gmail.com</p>
                <p>Telefono: 2461543789</p>
            </div>
        </div>

        <div class="footer-items">
            <h3>Redes</h3>
            <div>
                <a href="">Facebook</a>
                <a href="">Instagram</a>
                <a href="">twitter</a>
            </div>
        </div>
    </footer>

</body>
